[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hard1-benchmark"
version = "1.0.0"
description = "Hard-tail Agentic Reliability Dataset (HARD1)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Alex Geslani"}]
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.urls]
Repository = "https://github.com/AlexGeslani/HARD-Benchmark"

[project.scripts]
hard1 = "hard1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hard1"]
